{% set name = "chemcat" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/chemcat-{{ version }}.tar.gz
  sha256: 27c81db695c619299ea033092237f6bb8193515e7e3217290319025032778b3f

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  skip: true  # [win]
  skip: true  # [py<39]
requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - numpy
  run:
    - python
    - matplotlib-base >=3.9.2
    - more-itertools >=8.4.0
    - numpy >=2.0.0
    - scipy >=1.13.0

test:
  imports:
    - chemcat
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/atmolib/chemcat
  summary: Chemistry Calculator for Atmospheres
  license: GPL-2.0-or-later
  license_file:
    - LICENSE
  dev_url: https://github.com/atmolib/chemcat
  doc_url: https://chemcat.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pcubillos
